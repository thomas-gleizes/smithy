[package]
name = "smithy"
description = "TUI pour consulter la CI de ses forges (Forgejo d'abord)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
smithy-core.workspace = true
smithy-forgejo.workspace = true
smithy-github.workspace = true
smithy-gitlab.workspace = true
anyhow.workspace = true
tokio.workspace = true
ratatui.workspace = true
crossterm.workspace = true
toml.workspace = true
directories.workspace = true
unicode-width.workspace = true
serde.workspace = true
serde_json.workspace = true
syntect = { version = "5", default-features = false, features = ["parsing", "regex-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
pulldown-cmark = { version = "0.13", default-features = false }

[package.metadata.deb]
maintainer = "Thomas Gleizes <thomasgleizes34@gmail.com>"
section = "utils"
priority = "optional"
extended-description = "Consulte la CI (runs, logs), le code, les commits et les pull requests de forges git (Forgejo, GitHub, GitLab) dans le terminal."
assets = [
  ["target/release/smithy", "usr/bin/", "755"],
  ["../../README.md", "usr/share/doc/smithy/README.md", "644"],
  ["../../LICENSE-MIT", "usr/share/doc/smithy/LICENSE-MIT", "644"],
  ["../../LICENSE-APACHE", "usr/share/doc/smithy/LICENSE-APACHE", "644"],
]

[package.metadata.generate-rpm]
summary = "TUI pour consulter la CI de ses forges (Forgejo, GitHub, GitLab)"
assets = [
  { source = "target/release/smithy", dest = "/usr/bin/smithy", mode = "755" },
  { source = "README.md", dest = "/usr/share/doc/smithy/README.md", mode = "644", doc = true },
  { source = "LICENSE-MIT", dest = "/usr/share/doc/smithy/LICENSE-MIT", mode = "644", doc = true },
  { source = "LICENSE-APACHE", dest = "/usr/share/doc/smithy/LICENSE-APACHE", mode = "644", doc = true },
]

[lints]
workspace = true
