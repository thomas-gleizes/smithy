# Forgejo jetable pour la boucle de test locale de smithy.
# `./dev.sh up` démarre, `./dev.sh reset` détruit tout (volume inclus).
name: smithy-dev
services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:${FORGEJO_VERSION:-15}
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      FORGEJO__security__INSTALL_LOCK: "true"
      FORGEJO__database__DB_TYPE: sqlite3
      FORGEJO__server__DOMAIN: localhost
      FORGEJO__server__HTTP_PORT: "3000"
      FORGEJO__server__ROOT_URL: http://localhost:${FORGEJO_PORT:-3300}/
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      FORGEJO__actions__ENABLED: "true"
    ports:
      - "127.0.0.1:${FORGEJO_PORT:-3300}:3000"
    volumes:
      - forgejo-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/healthz"]
      interval: 3s
      timeout: 3s
      retries: 30
  runner:
    image: code.forgejo.org/forgejo/runner:${RUNNER_VERSION:-12}
    user: "0:0" # accès au socket Docker de l'hôte ; environnement de dev jetable uniquement
    depends_on:
      forgejo:
        condition: service_healthy
    environment:
      RUNNER_TOKEN: ${RUNNER_TOKEN:-}
    volumes:
      - runner-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /data
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        [ -f .runner ] || forgejo-runner register --no-interactive \
          --instance http://forgejo:3000 --token "$$RUNNER_TOKEN" \
          --name dev-runner --labels docker:docker://alpine:3.20
        exec forgejo-runner daemon
volumes:
  forgejo-data:
  runner-data:
